name: Desktop Release

# Push a tag like desktop-v0.0.1 matching version.cljs.
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: navi.exe
          - os: ubuntu-latest
            asset: navi-desktop-linux-x64
          - os: macos-15
            asset: navi-desktop-darwin-arm64
          - os: macos-15-intel
            asset: navi-desktop-darwin-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify tag matches version.cljs
        run: |
          version=$(sed -nE 's/.*goog-define VERSION "([^"]+)".*/\1/p' frontend/desktop/src/navi/desktop/version.cljs)
          if [ "desktop-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.cljs ($version)"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run test:sea
      - run: npm run desktop:build
      - run: npm run desktop:package

      - name: Smoke-test the packaged desktop CLI
        run: |
          exe="$GITHUB_WORKSPACE/frontend/desktop/dist/${{ matrix.asset }}"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$exe" version
          "$exe" help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: frontend/desktop/dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Navi Desktop $GITHUB_REF_NAME" --generate-notes
